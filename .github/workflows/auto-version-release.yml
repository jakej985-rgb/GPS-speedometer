name: Auto Version Bump & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'WORKFLOW_NOTES.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # Reuses the CI workflow's test + lint job instead of duplicating it, so a
  # push to main runs the gate exactly once while still blocking the release
  # on a green run.
  gatekeeper:
    name: Push Gatekeeper (Quality & Tests)
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release):')"
    uses: ./.github/workflows/ci.yml

  bump-and-release:
    name: Bump Version & Create Release
    needs: [gatekeeper]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine bump level
        id: bump_level
        # Commit messages and user input are passed through env, never spliced into the
        # script body: a merge commit's multi-line message would otherwise be executed
        # as shell commands and fail the step.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP_INPUT: ${{ github.event.inputs.bump_type }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BUMP="$BUMP_INPUT"
          elif printf '%s' "$COMMIT_MSG" | grep -qiE "breaking change|BREAKING:"; then
            BUMP="major"
          elif printf '%s' "$COMMIT_MSG" | grep -qiE "^feat(\(.*\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          : "${BUMP:=patch}"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Selected bump level: $BUMP"

      - name: Execute version bump
        run: |
          BUMP="${{ steps.bump_level.outputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            ./gradlew bumpMajor
          elif [ "$BUMP" = "minor" ]; then
            ./gradlew bumpMinor
          else
            ./gradlew bumpPatch
          fi

      - name: Read new version
        id: version
        run: |
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          PATCH=$(grep '^VERSION_PATCH=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          echo "New Version: $TAG (versionCode: $CODE)"

      - name: Commit, tag, and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version.properties
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"

          git push origin main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## GPS Speedometer ${{ steps.version.outputs.tag }}
            - Version Code: `${{ steps.version.outputs.code }}`
            - Automated release build generated from commit `${{ github.sha }}`.
            - Passed Quality & Test Push Gatekeeper.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
