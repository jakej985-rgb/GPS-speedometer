name: Auto Version Bump & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'WORKFLOW_NOTES.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  gatekeeper:
    name: Push Gatekeeper (Quality & Tests)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests Gate
        run: ./gradlew testDebugUnitTest

      - name: Run Lint Gate
        run: ./gradlew lintDebug

  bump-and-release:
    name: Bump Version & Create Release
    needs: [gatekeeper]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine bump level
        id: bump_level
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ github.event.inputs.bump_type }}"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -qiE "breaking change|BREAKING:"; then
              BUMP="major"
            elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.*\))?:"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Selected bump level: $BUMP"

      - name: Execute version bump
        run: |
          BUMP="${{ steps.bump_level.outputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            ./gradlew bumpMajor
          elif [ "$BUMP" = "minor" ]; then
            ./gradlew bumpMinor
          else
            ./gradlew bumpPatch
          fi

      - name: Read new version
        id: version
        run: |
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          PATCH=$(grep '^VERSION_PATCH=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          echo "New Version: $TAG (versionCode: $CODE)"

      - name: Commit, tag, and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version.properties
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"

          git push origin main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## GPS Speedometer ${{ steps.version.outputs.tag }}
            - Version Code: `${{ steps.version.outputs.code }}`
            - Automated release build generated from commit `${{ github.sha }}`.
            - Passed Quality & Test Push Gatekeeper.
          files: app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
