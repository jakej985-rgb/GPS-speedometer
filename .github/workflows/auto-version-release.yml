name: Auto Version Bump & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'WORKFLOW_NOTES.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # Reuses the CI workflow's test + lint job instead of duplicating it, so a
  # push to main runs the gate exactly once while still blocking the release
  # on a green run.
  gatekeeper:
    name: Push Gatekeeper (Quality & Tests)
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release):')"
    uses: ./.github/workflows/ci.yml

  bump-and-release:
    name: Bump Version & Create Release
    needs: [gatekeeper]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine bump level
        id: bump_level
        # Commit messages and user input are passed through env, never spliced into the
        # script body: a merge commit's multi-line message would otherwise be executed
        # as shell commands and fail the step.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP_INPUT: ${{ github.event.inputs.bump_type }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BUMP="$BUMP_INPUT"
          elif printf '%s' "$COMMIT_MSG" | grep -qiE "breaking change|BREAKING:"; then
            BUMP="major"
          elif printf '%s' "$COMMIT_MSG" | grep -qiE "^feat(\(.*\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          : "${BUMP:=patch}"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Selected bump level: $BUMP"

      # Only the working tree changes here; nothing is committed or pushed until
      # the APKs have been built, so a failure anywhere below leaves main intact
      # and consumes no version number.
      - name: Execute version bump
        run: |
          BUMP="${{ steps.bump_level.outputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            ./gradlew bumpMajor
          elif [ "$BUMP" = "minor" ]; then
            ./gradlew bumpMinor
          else
            ./gradlew bumpPatch
          fi

      - name: Read new version
        id: version
        run: |
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          PATCH=$(grep '^VERSION_PATCH=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          echo "New Version: $TAG (versionCode: $CODE)"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK artifacts
        run: |
          shopt -s nullglob
          release_apks=(app/build/outputs/apk/release/*.apk)
          debug_apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#release_apks[@]} -eq 0 ] || [ ${#debug_apks[@]} -eq 0 ]; then
            echo "Expected APKs are missing; refusing to publish a release."
            ls -R app/build/outputs || true
            exit 1
          fi
          ls -lh "${release_apks[@]}" "${debug_apks[@]}"

      # A draft release alongside a tag that does not exist yet: GitHub creates
      # the tag only when the draft is published, so the release (and all of its
      # assets) is assembled before anything reaches main.
      - name: Create draft release with APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          cat > release-notes.md <<EOF
          ## GPS Speedometer ${TAG}
          - Version Code: \`${CODE}\`
          - Automated release build generated from commit \`${GITHUB_SHA}\`.
          - Passed Quality & Test Push Gatekeeper.
          EOF
          gh release create "$TAG" \
            --draft \
            --title "Release $TAG" \
            --notes-file release-notes.md \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/debug/*.apk

      - name: Commit, tag, and push version bump
        id: push_bump
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # main requires a passing status check, and this commit is deliberately
          # excluded from CI ([skip ci] + the gatekeeper's own filter), so the push
          # is authenticated with the repo's deploy key, the ruleset's only bypass
          # actor. GITHUB_TOKEN cannot bypass a ruleset on a user-owned repo.
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$HOME/.ssh/release_key"
          chmod 600 "$HOME/.ssh/release_key"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

          git add version.properties
          git commit -m "chore(release): bump version to ${TAG} [skip ci]"
          git tag -a "$TAG" -m "Release $TAG"

          git push origin main
          git push origin "$TAG"

          rm -f "$HOME/.ssh/release_key"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

      # If the push never succeeded, drop the draft so a retry starts clean.
      - name: Discard draft release on failure
        if: failure() && steps.push_bump.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release delete "$TAG" --yes --cleanup-tag || true
